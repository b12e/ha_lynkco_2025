<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bat" x1="0" x2="1"><stop offset="0" stop-color="#4fc3f7"/><stop offset="1" stop-color="#41bdf5"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#1c1c1c" stroke="#2e2e2e"/>
  <!-- header -->
  <text x="28" y="44" fill="#e1e1e1" font-size="22" font-weight="600">Lynk &amp; Co 01</text>
  <text x="28" y="68" fill="#9e9e9e" font-size="13">Parked at home · locked · updated 2 min ago</text>
  <rect x="740" y="24" width="112" height="30" rx="15" fill="#1b3a2a" stroke="#2e7d4f"/>
  <circle cx="757" cy="39" r="4" fill="#4caf50"/>
  <text x="768" y="44" fill="#9ae6b4" font-size="13" font-weight="600">Charging</text>
  <!-- battery tile -->
  <rect x="28" y="92" width="400" height="104" rx="12" fill="#262626"/>
  <text x="48" y="120" fill="#9e9e9e" font-size="12" letter-spacing="0.5">BATTERY</text>
  <text x="48" y="160" fill="#e1e1e1" font-size="34" font-weight="700">78<tspan font-size="18" fill="#9e9e9e"> %</tspan></text>
  <text x="140" y="160" fill="#e1e1e1" font-size="16">58 km electric range</text>
  <rect x="48" y="172" width="360" height="8" rx="4" fill="#3a3a3a"/>
  <rect x="48" y="172" width="281" height="8" rx="4" fill="url(#bat)"/>
  <text x="408" y="120" fill="#9e9e9e" font-size="12" text-anchor="end">6.6 kW · 40 min left</text>
  <!-- climate tile -->
  <rect x="452" y="92" width="196" height="104" rx="12" fill="#262626"/>
  <text x="472" y="120" fill="#9e9e9e" font-size="12" letter-spacing="0.5">CLIMATE</text>
  <text x="472" y="160" fill="#e1e1e1" font-size="28" font-weight="700">21<tspan font-size="16" fill="#9e9e9e"> °C</tspan></text>
  <text x="472" y="184" fill="#ffb74d" font-size="13">Heating · 12 °C inside</text>
  <!-- doors tile -->
  <rect x="672" y="92" width="180" height="104" rx="12" fill="#262626"/>
  <text x="692" y="120" fill="#9e9e9e" font-size="12" letter-spacing="0.5">DOORS &amp; WINDOWS</text>
  <text x="692" y="160" fill="#e1e1e1" font-size="22" font-weight="700">All closed</text>
  <text x="692" y="184" fill="#4caf50" font-size="13">Central lock: locked</text>
  <!-- action row -->
  <g font-size="13" fill="#e1e1e1" font-weight="600">
    <rect x="28" y="220" width="150" height="40" rx="20" fill="#2b2b2b" stroke="#3a3a3a"/><text x="103" y="245" text-anchor="middle">Lock</text>
    <rect x="190" y="220" width="150" height="40" rx="20" fill="#2b2b2b" stroke="#3a3a3a"/><text x="265" y="245" text-anchor="middle">Start climate</text>
    <rect x="352" y="220" width="150" height="40" rx="20" fill="#2b2b2b" stroke="#3a3a3a"/><text x="427" y="245" text-anchor="middle">Flash lights</text>
    <rect x="514" y="220" width="150" height="40" rx="20" fill="#2b2b2b" stroke="#3a3a3a"/><text x="589" y="245" text-anchor="middle">Ventilate</text>
    <rect x="676" y="220" width="176" height="40" rx="20" fill="#1e3a4d" stroke="#41bdf5"/><text x="764" y="245" text-anchor="middle" fill="#41bdf5">Update location</text>
  </g>
  <text x="28" y="300" fill="#6f6f6f" font-size="12">Mock-up of a dashboard built from the integration's entities. Every value shown is a real entity.</text>
</svg>
