name: Pre-release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "custom_components/lynkco/**"

jobs:
  prerelease:
    runs-on: ubuntu-latest
    # Dependency bumps are merged automatically; they don't need a testable build.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute pre-release version
        id: prerelease
        run: |
          # Same calendar scheme as release.yml (YYYY.M.N): the version this PR
          # would become if released today, suffixed with the PR number.
          current=$(jq -r .version custom_components/lynkco/manifest.json)
          today=$(date -u +%Y.%-m)
          if [[ "$current" == "$today."* ]]; then
            patch="${current##*.}"
            patch="${patch%%-*}"
            next="${today}.$((patch + 1))"
          else
            next="${today}.0"
          fi
          version="${next}-pr${{ github.event.pull_request.number }}"
          echo "Pre-release ${version} (manifest is ${current})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Delete existing pre-release for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease) | .tagName | select(endswith("-pr${{ github.event.pull_request.number }}"))' | \
            while read -r tag; do
              echo "Deleting pre-release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.prerelease.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Pre-release from PR #${{ github.event.pull_request.number }}" \
            --prerelease \
            --target "${{ github.event.pull_request.head.sha }}"
