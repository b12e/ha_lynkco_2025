name: Pre-release

# A testable build of a pull request, made on request only:
#   Actions -> Pre-release -> Run workflow, with the pull request's number
#   or: gh workflow run prerelease.yml -f pr=<number>
# Running it again for the same pull request replaces the earlier build.
# release.yml removes these builds when the next release is published.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
        type: string

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr }}

    steps:
      - uses: actions/checkout@v7

      - name: Look up the pull request
        id: pr
        run: |
          # Stops here, before anything is deleted or created, when the input
          # is not the number of an open pull request.
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::'$PR' is not a pull request number"
            exit 1
          fi
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid -q '"\(.state) \(.headRefOid)"')
          state="${info%% *}"
          sha="${info##* }"
          if [ "$state" != "OPEN" ]; then
            echo "::error::Pull request #$PR is $state; only open pull requests get a pre-release"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute pre-release version
        id: prerelease
        run: |
          # Same calendar scheme as release.yml (YYYY.M.N): the version this PR
          # would become if released today, suffixed with the PR number.
          current=$(jq -r .version custom_components/lynkco/manifest.json)
          today=$(date -u +%Y.%-m)
          if [[ "$current" == "$today."* ]]; then
            patch="${current##*.}"
            patch="${patch%%-*}"
            next="${today}.$((patch + 1))"
          else
            next="${today}.0"
          fi
          version="${next}-pr${PR}"
          echo "Pre-release ${version} (manifest is ${current})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Delete existing pre-release for this PR
        run: |
          gh release list --json tagName,isPrerelease \
            -q ".[] | select(.isPrerelease) | .tagName | select(endswith(\"-pr${PR}\"))" | \
            while read -r tag; do
              echo "Deleting pre-release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done

      - name: Create pre-release
        env:
          VERSION: ${{ steps.prerelease.outputs.version }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Pre-release from PR #${PR}" \
            --prerelease \
            --target "$SHA"
